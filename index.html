<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./css/weui.min.css" />
    <link rel="stylesheet" href="./css/jquery-weui-no-flexible.min.css" />
    <link rel="stylesheet" href="./css/draw.css">
    <link rel="stylesheet" href="./css/alert.css">
    <script src="./js/flexible_css.js"></script>
    <script src="./js/flexible.js"></script>
    <title>转盘抽奖</title>
</head>

<body>
        <div class="draw_index" id="draw_i">
            <img src="images/logo.png" alt="" class="logo1">
            <img src="images/draw_index.png" alt="" class="draw_img">
            <div class="draw_canvas">
                <canvas id="wheelcanvas" width="422px" height="422px"></canvas>
            </div>
            <img class="pointer" src="images/turnplate-pointer.png" />
        </div>

    <script src="./js/jquery-3.2.1.min.js"></script>
    <script src="./js/jquery-weui.min.js"></script>
    <script src="./js/awardRotate.min.js"></script>
    <script src="./js/fastclick.min.js"></script>
    <script src="./js/preload.min.js"></script>
    <script src="./js/alert.js"></script>
    <script>
    var count = 0; //测试用
    var loading = false;
    var preConfig = {};

    preConfig = {
        isDebug: false,
        sources: {
            imgs: {
                source: [],
                callback: function() {
                    if (preConfig.sources.imgs.source.length != 0) {
                    }
                }
            },
            audio: {
                source: [],
                callback: function() {
                    if (preConfig.sources.audio.source.length != 0) {
                        // console.log("音频文件加载完成");
                    }
                }
            }
        },
        loadingOverTime: 60,
        loadingOverTimeCB: function(res) {
            console.log("资源加载超时：", res);
            $.modal({
                title: "错误",
                text: "网络环境不太好,连接超时了,刷新重试一下吧。",
                buttons: [
                    { text: "好的", onClick: function() { window.location = location; } }
                ]
            });
        },
        progress: function(completedCount, total) {
            console.log('待预加载文件数：' + (total - completedCount + 1));
            //加载进度
            val = Math.floor((completedCount / total) * 100);
        },
        completeLoad: function() {
            console.log("已完成所有加载项");
            //清空待预加载列表
            clearLoadingList();
            //渲染转盘
            drawRouletteWheel();
            //隐藏loading
            $.hideLoading();
        }
    };

    // 配置对象
    const CONFIG = {
        OUTSIDE_RADIUS: 193,
        TEXT_RADIUS: 155,
        INSIDE_RADIUS: 60,
        PRIZES: ["娥佩兰莹润滋养唇膏", "门店立减券", "随机品牌口红","天猫平台满减券", "京东平台满减券", "谢谢参与"],
        COLORS: ["rgba(0,0,0,0)", "rgba(0,0,0,0)", "rgba(0,0,0,0)", "rgba(0,0,0,0)", "rgba(0,0,0,0)", "rgba(0,0,0,0)"]
    };

    // 转盘状态对象
    const turnplate = {
        prizes: CONFIG.PRIZES,
        colors: CONFIG.COLORS,
        outsideRadius: CONFIG.OUTSIDE_RADIUS,
        textRadius: CONFIG.TEXT_RADIUS, 
        insideRadius: CONFIG.INSIDE_RADIUS,
        startAngle: 0,
        isRotating: false
    };

    //旋转转盘 item:奖品位置; txt：提示语;
    var rotateFn = function(item, txt, win) {
        var angles = item * (360 / turnplate.prizes.length / 2);
        if (angles < 270) {
            angles = 270 - angles;
        } else {
            angles = 360 - angles + 270;
        }
        $('#wheelcanvas').stopRotate();
        $('#wheelcanvas').rotate({
            angle: 0,
            animateTo: angles + 1800,
            duration: 8000,
            callback: function() {
                // 提示
                // 奖品  
                $.prealert.alert(txt,'',function(){
                    alert('111111')
                })
                turnplate.isRotating = false;
                //turnplate.bRotate = !turnplate.bRotate;
            }
        });
    };

    //预加载资源
    function preload() {
        $.showLoading('请稍候');
        new Preload(preConfig);
    }
    //清空预加载资源列表
    function clearLoadingList() {
        //清空图片预加载列表
        preConfig.sources.imgs.source = [];
        //清空音频文件预加载列表
        preConfig.sources.audio.source = [];
    }


    function rnd(n, m) {
        var random = Math.floor(Math.random() * (m - n + 1) + n);
        return random;
    }

    //页面所有元素加载完毕后执行drawRouletteWheel()方法对转盘进行渲染
    window.onload = function() {
        drawRouletteWheel();
        
        // 添加性能监控
        if (window.performance && window.performance.timing) {
            window.addEventListener('load', function() {
                setTimeout(function() {
                    let timing = window.performance.timing;
                    console.log('页面加载时间：', 
                        timing.loadEventEnd - timing.navigationStart + 'ms');
                }, 0);
            });
        }
        
        $(".kePublic").on("touchstart", function(e) {
            e.preventDefault();
        });
    };

    // 节流函数
    function throttle(fn, delay) {
        let timer = null;
        return function() {
            if(timer) return;
            timer = setTimeout(() => {
                fn.apply(this, arguments);
                timer = null;
            }, delay);
        }
    }

    // 优化后的转盘点击处理
    $('.pointer').on("touchend", throttle(function(e) {
        e.preventDefault();
        
        if (turnplate.isRotating) return;
        turnplate.isRotating = true;

        // 添加抽奖次数检查
        if(!checkDrawCount()) {
            turnplate.isRotating = false;
            return;
        }

        $.showLoading("请稍候");
        
        // 抽奖请求
        $.ajax({
            type: 'get',
            url: '/api/draw', // 设置实际的API地址
            dataType: 'json',
            timeout: 5000, // 添加超时设置
            success: function(response) {
                $.hideLoading();
                handleDrawResponse(response);
            },
            error: function(xhr, status, error) {
                $.hideLoading();
                handleDrawError(error);
                turnplate.isRotating = false;
            }
        });
    }, 1000));

    // 处理抽奖响应
    function handleDrawResponse(response) {
        if (response.err_code !== 0) {
            $.alert(response.err_msg);
            turnplate.isRotating = false;
            return;
        }
        
        const { vid, text, win } = response.data;
        rotateFn(vid, text, win);
    }

    // 检查抽奖次数
    function checkDrawCount() {
        // 实现抽奖次数检查逻辑
        return true;
    }

    // 优化Canvas绘制
    function drawRouletteWheel() {
        const canvas = document.getElementById("wheelcanvas");
        if (!canvas.getContext) return;

        const ctx = canvas.getContext("2d");
        const arc = Math.PI / (turnplate.prizes.length / 2);
        
        // 使用requestAnimationFrame优化渲染
        requestAnimationFrame(() => {
            ctx.clearRect(0, 0, 422, 422);
            ctx.font = '20px Microsoft YaHei';
            
            turnplate.prizes.forEach((prize, index) => {
                drawPrizeSection(ctx, prize, index, arc);
            });
        });
    }

    // 处理抽奖错误
    function handleDrawError(error) {
        $.alert('抽奖失败，请稍后重试');
        // console.error('Draw error:', error);
    }

    // 绘制奖品区块
    function drawPrizeSection(ctx, prize, index, arc) {
        const angle = turnplate.startAngle + index * arc;
        
        // 绘制扇形
        ctx.fillStyle = turnplate.colors[index];
        ctx.beginPath();
        ctx.arc(211, 211, turnplate.outsideRadius, angle, angle + arc, false);
        ctx.arc(211, 211, turnplate.insideRadius, angle + arc, angle, true);
        ctx.stroke();
        ctx.fill();
        
        // 绘制奖品文字
        ctx.save();
        ctx.fillStyle = "rgba(0,0,0,0)";
        ctx.strokeStyle = "rgba(0,0,0,0)";
        
        // 计算文字位置
        const text = prize;
        const line_height = 30;
        
        // 移动到正确的位置
        ctx.translate(
            211 + Math.cos(angle + arc / 2) * turnplate.textRadius,
            211 + Math.sin(angle + arc / 2) * turnplate.textRadius
        );
        
        // 旋转文字到正确的角度
        ctx.rotate(angle + arc / 2 + Math.PI / 2);
        
        // 分割文字并绘制
        const textParts = text.length > 4 ? 
            [text.substring(0, 4), text.substring(4)] : 
            [text];
            
        textParts.forEach((part, i) => {
            ctx.fillText(
                part,
                -ctx.measureText(part).width / 2,
                i * line_height + 20
            );
        });
        ctx.restore();
    }

    // 初始化函数
    function initTurnplate() {
        // 预加载图片
        preConfig.sources.imgs.source = [
            'images/turnplate-pointer.png',
            'images/draw_index.png',
            'images/logo.png'
        ];
        
        // 开始预加载
        preload();
        
        // 绑定 FastClick
        if ('addEventListener' in document) {
            document.addEventListener('DOMContentLoaded', function() {
                FastClick.attach(document.body);
            }, false);
        }
    }

    // 页面加载完成后初始化
    $(document).ready(function() {
        initTurnplate();
        
        // 防止页面滚动
        document.body.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
        
        // 错误处理
        window.onerror = function(msg, url, line, col, error) {
            console.error('Error: ' + msg + '\nurl: ' + url + '\nline: ' + line);
            return false;
        };
    });

    // 添加转盘重置函数
    function resetTurnplate() {
        turnplate.isRotating = false;
        $('#wheelcanvas').stopRotate();
        drawRouletteWheel();
    }

    // 添加销毁函数
    function destroyTurnplate() {
        // 移除事件监听
        $('.pointer').off('touchend');
        // 清理定时器
        clearLoadingList();
        // 重置状态
        resetTurnplate();
    }
    </script>
</body>

</html>
